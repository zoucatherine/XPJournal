openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: Journal entry operations
  - name: pin
    description: PIN lock operations
paths:
  /attachments/uploads:
    post:
      operationId: requestAttachmentUpload
      tags: [entries]
      summary: Reserve a private image upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadInput"
      responses:
        "201":
          description: Upload reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUpload"
        "400":
          description: Invalid image metadata
        "413":
          description: Image or account limit exceeded
        "503":
          description: Private image storage unavailable
  /attachments/{id}/finalize:
    post:
      operationId: finalizeAttachment
      tags: [entries]
      summary: Validate uploaded image bytes before attaching
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Verified private image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          description: Invalid image content
        "404":
          description: Upload not found
  /attachments/{id}:
    delete:
      operationId: discardAttachment
      tags: [entries]
      summary: Discard an upload not referenced by a saved entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Upload discarded
        "409":
          description: Image still belongs to a saved entry
        "404":
          description: Upload not found
  /attachments/{id}/image:
    get:
      operationId: getAttachmentImage
      tags: [entries]
      summary: Read a private verified image
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Image bytes (authenticated, no public URL)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Image not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /entries/search:
    get:
      operationId: searchEntries
      tags: [entries]
      summary: Search journal entries by keyword
      description: Returns entries whose title or body contains the query string (case-insensitive)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            description: Keyword to search for
      responses:
        "200":
          description: Matching entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List all journal entries
      description: Returns all journal entries (date, title, and body)
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Create a journal entry
      description: Creates a new journal entry for a given date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "409":
          description: Entry already exists for that date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /entries/{date}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get a journal entry by date
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD)
      responses:
        "200":
          description: Journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateEntry
      tags: [entries]
      summary: Update a journal entry
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJournalEntryInput"
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete a journal entry
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Entry deleted
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pin/status:
    get:
      operationId: getPinStatus
      tags: [pin]
      summary: Get PIN lock status
      description: Returns whether a PIN is currently configured
      responses:
        "200":
          description: PIN status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinStatus"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pin/set:
    post:
      operationId: setPin
      tags: [pin]
      summary: Set or change the PIN
      description: Creates or replaces the bcrypt-hashed PIN stored server-side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinInput"
      responses:
        "200":
          description: PIN set successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResult"
        "400":
          description: Invalid PIN format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pin/verify:
    post:
      operationId: verifyPin
      tags: [pin]
      summary: Verify a PIN attempt
      description: Compares the submitted PIN against the stored bcrypt hash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinInput"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pin/remove:
    delete:
      operationId: removePin
      tags: [pin]
      summary: Remove the PIN lock
      description: Deletes the stored PIN hash, disabling the lock
      responses:
        "200":
          description: PIN removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResult"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    JournalEntry:
      type: object
      properties:
        date:
          type: string
          description: ISO date string (YYYY-MM-DD)
        title:
          type: string
        body:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/EntryAttachment"
        mood:
          type: string
          nullable: true
          description: Mood emoji tag (e.g. 😊)
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - date
        - title
        - body
        - createdAt
        - updatedAt
    CreateJournalEntryInput:
      type: object
      properties:
        date:
          type: string
          description: ISO date string (YYYY-MM-DD)
        title:
          type: string
        body:
          type: string
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/AttachmentReference"
        mood:
          type: string
          nullable: true
          description: Mood emoji tag (e.g. 😊)
      required:
        - date
        - title
        - body
    UpdateJournalEntryInput:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        attachments:
          type: array
          maxItems: 10
          description: Required when editing an entry that already contains attachments; omission is rejected to protect older clients.
          items:
            $ref: "#/components/schemas/AttachmentReference"
        mood:
          type: string
          nullable: true
          description: Mood emoji tag (e.g. 😊)
      required:
        - title
        - body
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AttachmentReference:
      type: object
      required: [id, offset]
      properties:
        id: { type: string, format: uuid }
        offset: { type: integer, minimum: 0, description: UTF-16 offset in plain-text body }
        caption: { type: string, nullable: true, maxLength: 200, description: Optional personal label. Null or empty clears it; omission preserves the saved caption. }
    Attachment:
      type: object
      required: [id, name, size, contentType]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        caption: { type: string, nullable: true, maxLength: 200 }
        size: { type: integer }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    EntryAttachment:
      type: object
      required: [id, offset, name, size, contentType]
      properties:
        id: { type: string, format: uuid }
        offset: { type: integer, minimum: 0 }
        name: { type: string }
        caption: { type: string, nullable: true, maxLength: 200 }
        size: { type: integer }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    AttachmentUploadInput:
      type: object
      required: [date, name, size, contentType]
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        size: { type: integer, minimum: 1, maximum: 1048576 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    AttachmentUpload:
      type: object
      required: [id, uploadURL]
      properties:
        id: { type: string, format: uuid }
        uploadURL: { type: string }
    PinStatus:
      type: object
      properties:
        configured:
          type: boolean
          description: Whether a PIN is currently configured
      required:
        - configured
    PinInput:
      type: object
      properties:
        pin:
          type: string
          description: 4-digit numeric PIN
      required:
        - pin
    PinResult:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded
      required:
        - ok
