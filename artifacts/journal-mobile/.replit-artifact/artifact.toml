kind = "mobile"
previewPath = "/journal-mobile/"
title = "Journal Mobile"
version = "1.0.0"
id = "artifacts/journal-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/journal-mobile/" ]
localPort = 21740

[services.development]
run = "pnpm --filter @workspace/journal-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/journal-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/journal-mobile", "run", "serve" ]

[services.env]
PORT = "21740"
BASE_PATH = "/journal-mobile/"
